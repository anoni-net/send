version: 2

# Actions and the base image are pinned by commit SHA / digest, which is what
# stops a moved tag from executing in a job that holds packages:write and can
# mint a Sigstore signature. A pin also freezes security fixes, so Dependabot
# advances the pins and keeps the human-readable tag comment in step, turning a
# manual chore into a reviewable PR.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # The image runs Node 24 on purpose (Dockerfile, CI). Keep the base image
      # on 24.x for patch/digest updates; a move to a new major is a deliberate
      # decision, not a Dependabot bump.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # npm security updates arrive regardless of this entry; what the entry adds
  # is grouping. Without it every advisory opened its own PR, and a dozen sat
  # open at once, each superseded by the next. Version updates stay off
  # (limit 0): dependency bumps go into a release deliberately, because a
  # build-tool bump can change the bytes in dist/ that SHA256SUMS.txt covers.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
